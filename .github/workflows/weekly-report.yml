# Weekly email digest.
#
# Read-only: this job never writes repository files and has NO commit step.
# It shares the "update-papers" concurrency group with the two update
# workflows so it cannot read a half-written docs/cv-arxiv-daily.json.
#
# Monday 09:00 UTC = Monday 17:00 Asia/Shanghai, one hour after the weekly
# code-link update job (0 8 * * 1).

name: Weekly Paper Report

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印邮件正文，不发送"
        type: boolean
        default: false
  schedule:
    - cron: "0 9 * * 1"

concurrency:
  group: update-papers
  cancel-in-progress: false

jobs:
  report:
    name: weekly-report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python Env
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Sending is enabled only once the mail credentials exist, so a fork
      # without Secrets degrades to a harmless dry-run instead of failing.
      - name: Build and send weekly report
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          ELSEVIER_API_KEY: ${{ secrets.ELSEVIER_API_KEY }}
        run: |
          DRY="${{ github.event.inputs.dry_run }}"
          if [ "$DRY" = "true" ] || [ -z "$MAIL_PASSWORD" ]; then
            echo "dry-run: printing the report without sending"
            python weekly_report.py --dry-run
          else
            python weekly_report.py --send
          fi
